name: Collect Economic Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Type check scripts
        run: pnpm run type-check:scripts

      - name: Test scripts
        run: pnpm exec vitest run scripts

      - name: Run collection
        timeout-minutes: 10
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        run: pnpm exec tsx scripts/collect-static.ts

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update economic data [skip ci]"
            git pull --rebase
            git push
          fi

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report failure to issue
        run: |
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          existing=$(gh issue list --label collect-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "再度失敗しました（${now}）。
          実行: ${RUN_URL}"
          else
            gh label create collect-failure --description "収集ジョブの失敗" --color D73A4A || true
            gh issue create \
              --title "収集ジョブが失敗しました" \
              --label collect-failure \
              --body "収集ジョブが失敗しました（${now}）。
          実行: ${RUN_URL}

          直近の成功データを確認し、原因が解消したらこの Issue を閉じてください。"
          fi
