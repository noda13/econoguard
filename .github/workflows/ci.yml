name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend & scripts (type-check & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Generate Prisma Client
        env:
          DATABASE_URL: 'file:./dev.db'
        run: pnpm --filter backend run prisma:generate

      - name: Type check
        run: pnpm --filter backend exec tsc --noEmit

      - name: Type check scripts
        run: pnpm run type-check:scripts

      - name: Unit tests
        run: pnpm test

  frontend:
    name: Frontend (type-check & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Type check
        run: pnpm --filter frontend run type-check

      - name: Build
        run: pnpm --filter frontend run build
